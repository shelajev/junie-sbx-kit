name: Validate and publish kits

# No pull_request, tag, or manual triggers. Only main pushes can publish.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'shelajev/junie-sbx-kit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check scripts and redaction
        run: |
          bash -n scripts/install.sh scripts/junie.sh scripts/startup.sh auth-trace/scripts/start.sh
          python3 -m unittest discover -s tests -v

      - name: Read descriptor versions
        id: versions
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          workload = re.search(r'(?m)^  version:\n    default: "([0-9]+\.[0-9]+)"$', Path('junie.yaml').read_text())
          trace = re.search(r'(?m)^version: "([0-9]+\.[0-9]+\.[0-9]+)"$', Path('auth-trace/auth-trace.yaml').read_text())
          if workload is None or trace is None:
              raise SystemExit('Cannot read the pinned descriptor versions.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'junie={workload[1]}\ntrace={trace[1]}\n')
          PY

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.8'
          cache: false

      - name: Check out pinned conformance tool
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: docker/sandbox-kit-spec
          ref: 061f12c4ab70e32cbfb0816e06fb66f4dcad4679
          path: .local/kit-spec
          persist-credentials: false

      - name: Build pinned kit conformance tool
        working-directory: .local/kit-spec
        run: |
          mkdir -p "$RUNNER_TEMP/kit-tools"
          go build -o "$RUNNER_TEMP/kit-tools/kit-tck" ./cmd/kit-tck
          echo "$RUNNER_TEMP/kit-tools" >> "$GITHUB_PATH"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Junie for conformance
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: junie.yaml
          platforms: linux/amd64,linux/arm64
          tags: junie-check:${{ steps.versions.outputs.junie }}
          outputs: type=oci,dest=/tmp/junie-layout,tar=false
          cache-from: type=gha,scope=junie
          cache-to: type=gha,mode=max,scope=junie

      - name: Build tracer for conformance
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: auth-trace
          file: auth-trace/auth-trace.yaml
          platforms: linux/amd64,linux/arm64
          tags: trace-check:${{ steps.versions.outputs.trace }}
          outputs: type=oci,dest=/tmp/trace-layout,tar=false

      - name: Validate both platforms before publishing
        env:
          JUNIE_VERSION: ${{ steps.versions.outputs.junie }}
          TRACE_VERSION: ${{ steps.versions.outputs.trace }}
        run: |
          kit-tck validate --layout /tmp/junie-layout "$JUNIE_VERSION"
          kit-tck validate --layout /tmp/trace-layout "$TRACE_VERSION"

      - name: Check publishing configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo 'Set the DOCKERHUB_USERNAME repository variable.' >&2; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Add the DOCKERHUB_TOKEN repository secret, then rerun this workflow.' >&2; exit 1; }

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Junie
        id: junie
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: junie.yaml
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/junie-sandbox-kit:${{ steps.versions.outputs.junie }}
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/junie-sandbox-kit:latest
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/junie-sandbox-kit:sha-${{ github.sha }}

      - name: Publish optional tracer
        id: trace
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: auth-trace
          file: auth-trace/auth-trace.yaml
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/junie-auth-trace:${{ steps.versions.outputs.trace }}
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/junie-auth-trace:latest
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/junie-auth-trace:sha-${{ github.sha }}

      - name: Verify published kits by digest
        env:
          JUNIE_IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/junie-sandbox-kit@${{ steps.junie.outputs.digest }}
          TRACE_IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/junie-auth-trace@${{ steps.trace.outputs.digest }}
        run: |
          kit-tck validate "$JUNIE_IMAGE"
          kit-tck validate "$TRACE_IMAGE"
          # shellcheck disable=SC2016
          printf 'Published and validated:\n\n- `%s`\n- `%s`\n' "$JUNIE_IMAGE" "$TRACE_IMAGE" >> "$GITHUB_STEP_SUMMARY"
