# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: Junie CLI
description: JetBrains Junie CLI with a bundled Java runtime in Docker Sandboxes
sourceUrl: https://github.com/JetBrains/junie
licenses: [SEE LICENSE IN https://github.com/JetBrains/junie/blob/main/LICENSE.md]
version: "${{ kit.args.version }}"
args:
  version:
    default: "3579.5"
    pattern: '^[0-9]+\.[0-9]+$'
    description: Junie build; must have an entry in releases.sha256
    buildArg: JUNIE_VERSION
  model:
    default: "junie-lite"
    pattern: '^[A-Za-z0-9._:/-]*$'
    description: Model alias; defaults to free Junie Lite, empty uses Junie's default
    env: JUNIE_MODEL
provides: ["junie@${{ kit.args.version }}"]
capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - ingrazzio-cloud-prod.labs.jb.gg:443
          - api.jetbrains.ai:443
          - api.jetbrains.cloud:443
          - auth.grazie.ai:443
          - account.jetbrains.com:443
          - oauth.account.jetbrains.com:443
          - api.app.prod.grazie.aws.intellij.net:443
          - junie.jetbrains.com:443
  - type: com.docker.sandbox/agent-sessions@1
    config:
      prompt: ["--task", "{{.Prompt}}"]
  - type: com.docker.sandbox/agent-interactive-sessions@1
    config:
      newSession: []
      prompt: ["--prompt", "{{.Prompt}}"]
      continue: ["--resume"]
      resume: ["--resume", "--session-id", "{{.SessionID}}"]
  - type: com.docker.sandbox/volume@1
    config: {path: /home/agent/.junie, size: 2g}
  - type: com.docker.sandbox/volume@1
    config: {path: /home/agent/.local/share/junie, size: 1g}
  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - command: ["/usr/local/lib/junie-kit/startup.sh"]
          user: "0"
          env: [WORKSPACE_DIR]
          description: Restore state ownership and trust the sandbox's TLS proxy
  - type: com.docker.sandbox/agent-skills@1
    optional: true
    config: {path: /opt/junie-skills, mode: readonly}
  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md
      # rc5 lacks the newer directory field. startup links this legacy
      # profile into Junie's global instructions without replacing user text.
      contentFile: ./junie-context.md
